<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1400" viewBox="0 0 1200 1400" style="font-family: -apple-system, Helvetica, sans-serif;">
  <defs>
    <style>
      .label { font-size: 13px; fill: #666; letter-spacing: 0.06em; text-transform: uppercase; }
      .name { font-size: 11px; fill: #999; }
      .swatch-h { font-size: 11px; fill: #888; font-family: monospace; }
    </style>
  </defs>

  <rect width="1200" height="1400" fill="#FAFAFA"/>
  <text x="60" y="50" font-size="22" font-weight="700" fill="#111">Spot the Brand · Logo concepts v0</text>
  <text x="60" y="74" font-size="12" fill="#666">5 variants for review. All are SVG, editable, scalable. Final selection drives the production lockups.</text>

  <!-- ───────── Variant 1: Wordmark only ───────── -->
  <text x="60" y="140" class="label">Variant 01 — Wordmark</text>
  <rect x="60" y="160" width="540" height="160" fill="#0A0A0A"/>
  <text x="90" y="265" font-size="56" font-weight="800" fill="white" letter-spacing="-1.5">Spot the Brand<tspan fill="#FF1300">.</tspan></text>
  <rect x="620" y="160" width="540" height="160" fill="white" stroke="#eee"/>
  <text x="650" y="265" font-size="56" font-weight="800" fill="#0A0A0A" letter-spacing="-1.5">Spot the Brand<tspan fill="#FF1300">.</tspan></text>
  <text x="60" y="345" class="name">The default. Period in Spot Red. Works on dark + light.</text>

  <!-- ───────── Variant 2: Boxed wordmark with DETECTED label ───────── -->
  <text x="60" y="395" class="label">Variant 02 — Boxed (signature device)</text>
  <rect x="60" y="415" width="540" height="190" fill="#0A0A0A"/>
  <rect x="100" y="450" width="460" height="120" fill="none" stroke="#FF1300" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="110" y="442" font-size="11" fill="#FF1300" font-family="monospace" letter-spacing="1">DETECTED · 0.99</text>
  <text x="125" y="535" font-size="44" font-weight="800" fill="white" letter-spacing="-1.2">Spot the Brand<tspan fill="#FF1300">.</tspan></text>
  <rect x="620" y="415" width="540" height="190" fill="white" stroke="#eee"/>
  <rect x="660" y="450" width="460" height="120" fill="none" stroke="#FF1300" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="670" y="442" font-size="11" fill="#FF1300" font-family="monospace" letter-spacing="1">DETECTED · 0.99</text>
  <text x="685" y="535" font-size="44" font-weight="800" fill="#0A0A0A" letter-spacing="-1.2">Spot the Brand<tspan fill="#FF1300">.</tspan></text>
  <text x="60" y="635" class="name">The hero lockup. Dashed bounding box = computer vision metaphor.</text>

  <!-- ───────── Variant 3: App icon / mark ───────── -->
  <text x="60" y="690" class="label">Variant 03 — App icon</text>
  <!-- big -->
  <rect x="60" y="710" width="160" height="160" rx="32" fill="#FF1300"/>
  <rect x="92" y="742" width="96" height="96" fill="none" stroke="white" stroke-width="2.5" stroke-dasharray="5 3"/>
  <circle cx="140" cy="790" r="6" fill="white"/>
  <!-- medium -->
  <rect x="240" y="710" width="80" height="80" rx="16" fill="#FF1300"/>
  <rect x="256" y="726" width="48" height="48" fill="none" stroke="white" stroke-width="1.5" stroke-dasharray="3 2"/>
  <circle cx="280" cy="750" r="3" fill="white"/>
  <!-- small (favicon) -->
  <rect x="340" y="710" width="32" height="32" rx="6" fill="#FF1300"/>
  <rect x="346" y="716" width="20" height="20" fill="none" stroke="white" stroke-width="1"/>
  <!-- tiny -->
  <rect x="392" y="722" width="16" height="16" rx="3" fill="#FF1300"/>
  <text x="60" y="900" class="name">Red surface, white bounding-box-with-dot inside. Scales to 16px favicon.</text>

  <!-- ───────── Variant 4: Horizontal compact ───────── -->
  <text x="60" y="950" class="label">Variant 04 — Horizontal compact</text>
  <rect x="60" y="970" width="540" height="100" fill="#0A0A0A"/>
  <rect x="90" y="998" width="44" height="44" rx="9" fill="#FF1300"/>
  <rect x="98" y="1006" width="28" height="28" fill="none" stroke="white" stroke-width="1.5" stroke-dasharray="3 2"/>
  <text x="155" y="1031" font-size="26" font-weight="800" fill="white" letter-spacing="-0.5">Spot the Brand<tspan fill="#FF1300">.</tspan></text>
  <rect x="620" y="970" width="540" height="100" fill="white" stroke="#eee"/>
  <rect x="650" y="998" width="44" height="44" rx="9" fill="#FF1300"/>
  <rect x="658" y="1006" width="28" height="28" fill="none" stroke="white" stroke-width="1.5" stroke-dasharray="3 2"/>
  <text x="715" y="1031" font-size="26" font-weight="800" fill="#0A0A0A" letter-spacing="-0.5">Spot the Brand<tspan fill="#FF1300">.</tspan></text>
  <text x="60" y="1095" class="name">App icon + wordmark side by side. For headers, footers, email signatures.</text>

  <!-- ───────── Variant 5: Stamp / monogram ───────── -->
  <text x="60" y="1145" class="label">Variant 05 — Stamp / monogram (compact)</text>
  <g transform="translate(60, 1170)">
    <rect width="120" height="120" fill="#0A0A0A"/>
    <text x="60" y="50" text-anchor="middle" font-size="40" font-weight="800" fill="white">S</text>
    <rect x="20" y="62" width="80" height="38" fill="none" stroke="#FF1300" stroke-width="1.5" stroke-dasharray="3 2"/>
    <text x="60" y="86" text-anchor="middle" font-size="10" fill="#FF1300" font-family="monospace" letter-spacing="1">SPOT</text>
  </g>
  <g transform="translate(200, 1170)">
    <rect width="120" height="120" fill="#FF1300"/>
    <text x="60" y="50" text-anchor="middle" font-size="40" font-weight="800" fill="white">S</text>
    <rect x="20" y="62" width="80" height="38" fill="none" stroke="white" stroke-width="1.5" stroke-dasharray="3 2"/>
    <text x="60" y="86" text-anchor="middle" font-size="10" fill="white" font-family="monospace" letter-spacing="1">SPOT</text>
  </g>
  <g transform="translate(340, 1170)">
    <rect width="120" height="120" fill="white" stroke="#eee"/>
    <text x="60" y="50" text-anchor="middle" font-size="40" font-weight="800" fill="#0A0A0A">S</text>
    <rect x="20" y="62" width="80" height="38" fill="none" stroke="#FF1300" stroke-width="1.5" stroke-dasharray="3 2"/>
    <text x="60" y="86" text-anchor="middle" font-size="10" fill="#FF1300" font-family="monospace" letter-spacing="1">SPOT</text>
  </g>
  <text x="60" y="1325" class="name">Square stamp. Optional: use for social profile pic if app icon feels too literal.</text>

  <!-- ───────── Color swatches ───────── -->
  <g transform="translate(620, 1170)">
    <text x="0" y="-10" class="label">Color palette</text>
    <rect x="0" y="0" width="100" height="80" fill="#FF1300"/>
    <text x="50" y="100" text-anchor="middle" class="swatch-h">#FF1300</text>
    <text x="50" y="115" text-anchor="middle" font-size="10" fill="#666">Spot Red</text>

    <rect x="110" y="0" width="100" height="80" fill="#0A0A0A"/>
    <text x="160" y="100" text-anchor="middle" class="swatch-h">#0A0A0A</text>
    <text x="160" y="115" text-anchor="middle" font-size="10" fill="#666">Black</text>

    <rect x="220" y="0" width="100" height="80" fill="#FBBF24"/>
    <text x="270" y="100" text-anchor="middle" class="swatch-h">#FBBF24</text>
    <text x="270" y="115" text-anchor="middle" font-size="10" fill="#666">Tier-1 Gold</text>

    <rect x="330" y="0" width="100" height="80" fill="#4ADE80"/>
    <text x="380" y="100" text-anchor="middle" class="swatch-h">#4ADE80</text>
    <text x="380" y="115" text-anchor="middle" font-size="10" fill="#666">Detect Green</text>

    <rect x="440" y="0" width="100" height="80" fill="#EDEDED" stroke="#eee"/>
    <text x="490" y="100" text-anchor="middle" class="swatch-h">#EDEDED</text>
    <text x="490" y="115" text-anchor="middle" font-size="10" fill="#666">Off-white</text>
  </g>
</svg>
