<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Start free trial · Spot the Brand</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root { --bg: #0a0a0a; --panel: #141414; --border: #2a2a2a; --text: #ededed; --muted: #888; --accent: #FF1300; --good: #4ade80; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif; line-height: 1.55; }
  .container { max-width: 460px; margin: 80px auto; padding: 0 24px; }
  .logo { font-size: 22px; font-weight: 700; text-align: center; margin-bottom: 28px; }
  .logo span { color: var(--accent); }
  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 36px; }
  h1 { font-size: 26px; letter-spacing: -0.02em; margin-bottom: 8px; text-align: center; }
  .lead { color: var(--muted); text-align: center; font-size: 14px; margin-bottom: 28px; }
  .oauth-btn { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; padding: 12px 16px; background: var(--bg); border: 1px solid var(--border); color: var(--text); border-radius: 10px; font-size: 14px; font-weight: 500; cursor: pointer; margin-bottom: 10px; transition: all 0.15s; }
  .oauth-btn:hover { border-color: var(--accent); }
  .oauth-btn svg { width: 18px; height: 18px; }
  .divider { display: flex; align-items: center; margin: 20px 0; color: var(--muted); font-size: 12px; }
  .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: var(--border); }
  .divider span { padding: 0 14px; }
  input { width: 100%; padding: 12px 14px; background: var(--bg); border: 1px solid var(--border); color: var(--text); border-radius: 8px; font-size: 14px; margin-bottom: 12px; }
  input:focus { outline: none; border-color: var(--accent); }
  button.primary { width: 100%; padding: 13px 20px; background: var(--accent); color: white; border: none; border-radius: 10px; font-size: 14px; font-weight: 500; cursor: pointer; }
  button.primary:hover { opacity: 0.9; }
  .switch { text-align: center; margin-top: 22px; font-size: 13px; color: var(--muted); }
  .switch a { color: var(--accent); }
  .legal { font-size: 11px; color: var(--muted); text-align: center; margin-top: 18px; line-height: 1.5; }
  .legal a { color: var(--text); }
  .status { font-size: 12px; color: var(--muted); margin-top: 12px; text-align: center; min-height: 16px; }
  .status.error { color: var(--accent); }
  .status.success { color: var(--good); }
</style>
</head>
<body>

<div class="container">
  <div class="logo">Spot the Brand<span>.</span></div>
  <div class="panel">
    <h1>Start your free trial</h1>
    <p class="lead">14 days. No credit card required.</p>

    <button class="oauth-btn" id="oauth-google">
      <svg viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
      Continue with Google
    </button>
    <button class="oauth-btn" id="oauth-facebook">
      <svg viewBox="0 0 24 24"><path fill="#1877F2" d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073"/></svg>
      Continue with Meta (Facebook)
    </button>
    <button class="oauth-btn" id="oauth-instagram">
      <svg viewBox="0 0 24 24"><defs><linearGradient id="ig-grad" x1="0%" y1="100%" x2="100%" y2="0%"><stop offset="0%" stop-color="#FFD600"/><stop offset="50%" stop-color="#FF1493"/><stop offset="100%" stop-color="#9b1ec7"/></linearGradient></defs><path fill="url(#ig-grad)" d="M12 2.16c3.2 0 3.58.01 4.85.07 1.17.05 1.8.25 2.23.41.56.22.96.48 1.38.9.42.42.68.82.9 1.38.16.42.36 1.06.41 2.23.06 1.27.07 1.65.07 4.85s-.01 3.58-.07 4.85c-.05 1.17-.25 1.8-.41 2.23-.22.56-.48.96-.9 1.38-.42.42-.82.68-1.38.9-.42.16-1.06.36-2.23.41-1.27.06-1.65.07-4.85.07s-3.58-.01-4.85-.07c-1.17-.05-1.8-.25-2.23-.41-.56-.22-.96-.48-1.38-.9-.42-.42-.68-.82-.9-1.38-.16-.42-.36-1.06-.41-2.23C2.17 15.58 2.16 15.2 2.16 12s.01-3.58.07-4.85c.05-1.17.25-1.8.41-2.23.22-.56.48-.96.9-1.38.42-.42.82-.68 1.38-.9.42-.16 1.06-.36 2.23-.41C8.42 2.17 8.8 2.16 12 2.16M12 0C8.74 0 8.33.01 7.05.07 5.78.13 4.9.33 4.14.63c-.78.3-1.45.71-2.11 1.38C1.36 2.68.95 3.35.65 4.14.35 4.9.14 5.78.08 7.05.02 8.33 0 8.74 0 12c0 3.26.01 3.67.07 4.95.06 1.27.27 2.15.57 2.91.3.78.71 1.45 1.38 2.11.66.66 1.33 1.08 2.11 1.38.76.3 1.64.5 2.91.57C8.33 23.98 8.74 24 12 24c3.26 0 3.67-.01 4.95-.07 1.27-.06 2.15-.27 2.91-.57.78-.3 1.45-.71 2.11-1.38.66-.66 1.08-1.33 1.38-2.11.3-.76.5-1.64.57-2.91.06-1.28.07-1.69.07-4.95s-.01-3.67-.07-4.95c-.06-1.27-.27-2.15-.57-2.91-.3-.78-.71-1.45-1.38-2.11C21.32 1.36 20.65.95 19.86.65 19.1.35 18.22.14 16.95.08 15.67.02 15.26 0 12 0z M12 5.84c-3.4 0-6.16 2.76-6.16 6.16S8.6 18.16 12 18.16s6.16-2.76 6.16-6.16S15.4 5.84 12 5.84zM12 16c-2.2 0-4-1.8-4-4s1.8-4 4-4 4 1.8 4 4-1.8 4-4 4zM19.85 5.6c0 .8-.65 1.44-1.44 1.44-.79 0-1.44-.64-1.44-1.44 0-.79.65-1.44 1.44-1.44.79 0 1.44.65 1.44 1.44z"/></svg>
      Continue with Instagram
    </button>

    <div class="divider"><span>or with email</span></div>

    <form id="email-form">
      <input type="email" name="email" placeholder="Work email" required>
      <input type="password" name="password" placeholder="Choose a password (min 8 chars)" minlength="8" required>
      <button class="primary" type="submit">Create account</button>
    </form>

    <div class="status" id="status"></div>

    <div class="switch">Already have an account? <a href="login.html">Sign in</a></div>
    <div class="legal">
      By continuing, you agree to our <a href="/terms.html">Terms</a> and <a href="/privacy.html">Privacy Policy</a>.
      We use OAuth to verify your identity — we never see your password.
    </div>
  </div>
</div>

<script type="module">
const SUPABASE_URL = "https://menaatbeoeutywulcdvv.supabase.co";
const SUPABASE_ANON = "sb_publishable_Xo1fjg6JZF5yUBASwaMhcg_tddVt79z";
const { createClient } = supabase;
const sb = createClient(SUPABASE_URL, SUPABASE_ANON);

const statusEl = document.getElementById("status");
function setStatus(msg, kind = "") {
  statusEl.textContent = msg;
  statusEl.className = "status " + kind;
}

async function startOAuth(provider) {
  setStatus(`Redirecting to ${provider}...`);
  const { error } = await sb.auth.signInWithOAuth({
    provider,
    options: {
      redirectTo: `${location.origin}/onboarding-v2.html`,
    },
  });
  if (error) setStatus(`OAuth error: ${error.message}. Provider may not be configured yet.`, "error");
}

document.getElementById("oauth-google").addEventListener("click", () => startOAuth("google"));
document.getElementById("oauth-facebook").addEventListener("click", () => startOAuth("facebook"));
document.getElementById("oauth-instagram").addEventListener("click", () => {
  setStatus("Instagram Login requires Meta Business verification. Use Continue with Meta for now.", "error");
});

document.getElementById("email-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const data = Object.fromEntries(new FormData(e.target).entries());
  setStatus("Creating account...");
  const { error } = await sb.auth.signUp({
    email: data.email,
    password: data.password,
    options: { emailRedirectTo: `${location.origin}/onboarding-v2.html` },
  });
  if (error) {
    setStatus(error.message, "error");
    return;
  }
  setStatus("Check your inbox to confirm your email.", "success");
});
</script>

</body>
</html>
